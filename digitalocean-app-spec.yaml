name: bascavarat-store
region: fra
static_sites:
- name: bascavarat-store
  source_dir: /
  build_command: npm run build
  output_dir: dist
  github:
    branch: main
    deploy_on_push: true
    repo: mostmaz/bas
  routes:
  - path: /
  environment_slug: html
  # Note: Static Sites on App Platform have fixed cache policies (10s browser, 24h CDN).
  # To customize this, you must use a Web Service (Docker/Nginx) or a Droplet.
  cors:
    allow_origins:
      - "*"
