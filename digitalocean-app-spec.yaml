name: bascavarat-store
region: fra
services:
- name: bascavarat-store
  dockerfile_path: Dockerfile
  source_dir: /
  github:
    branch: main
    deploy_on_push: true
    repo: mostmaz/bas
  http_port: 80
  routes:
  - path: /
  # Web Service allows custom Nginx config for caching

  cors:
    allow_origins:
      - "*"
